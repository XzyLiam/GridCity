<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Grid Floor Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #ffffff; font-family: system-ui, sans-serif; touch-action: none; }
    canvas { display: block; }
    #joystick {
      position: fixed;
      bottom: 110px;
      left: 40px;
      width: 130px;
      height: 130px;
      background: rgba(0,0,0,0.08);
      border: 2px solid rgba(0,0,0,0.18);
      border-radius: 50%;
      display: none;
      touch-action: none;
      z-index: 20;
    }
    #knob {
      position: absolute;
      width: 54px;
      height: 54px;
      background: rgba(0,0,0,0.35);
      border-radius: 50%;
      left: 38px;
      top: 38px;
      pointer-events: none;
    }
    .mobile #joystick { display: block; }

    #menu {
      position: fixed;
      bottom: 80px;
      left: 16px;
      right: 70px;
      max-width: 380px;
      background: rgba(240, 240, 240, 0.95);
      border-radius: 14px;
      padding: 6px;
      display: flex;
      gap: 4px;
      z-index: 15;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateY(140%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
    }
    #menu.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .menu-item {
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #555;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
      text-align: center;
    }
    .menu-item:hover,
    .menu-item.active {
      background: rgba(0,0,0,0.07);
      color: #222;
    }
    .menu-item.active {
      background: rgba(0,0,0,0.11);
    }

    #menu-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(245, 245, 245, 0.96);
      border: 2px solid rgba(0,0,0,0.1);
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      z-index: 30;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #444;
      transition: background 0.15s, transform 0.15s;
    }
    #menu-toggle:active {
      transform: scale(0.92);
      background: rgba(230, 230, 230, 0.98);
    }

    @media (max-width: 600px) {
      #menu {
        bottom: 78px;
        left: 12px;
        right: 68px;
        padding: 5px;
        gap: 3px;
      }
      .menu-item {
        padding: 10px 6px;
        font-size: 12px;
      }
      #joystick {
        bottom: 100px;
        left: 20px;
        width: 120px;
        height: 120px;
      }
      #knob {
        width: 50px;
        height: 50px;
        left: 35px;
        top: 35px;
      }
      #menu-toggle {
        bottom: 18px;
        right: 16px;
        width: 46px;
        height: 46px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="joystick">
    <div id="knob"></div>
  </div>
  <div id="menu">
    <button class="menu-item active" data-section="buildings">Buildings</button>
    <button class="menu-item" data-section="roads">Roads</button>
    <button class="menu-item" data-section="decoration">Decoration</button>
    <button class="menu-item" data-section="electronic">Electronic</button>
  </div>
  <button id="menu-toggle">☰</button>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    const menu = document.getElementById('menu');
    const menuToggle = document.getElementById('menu-toggle');
    const menuItems = document.querySelectorAll('.menu-item');

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('open');
    });
    menuToggle.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });

    menuItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        menuItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        if (window.innerWidth <= 600) menu.classList.remove('open');
      });
      item.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    });
    menu.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    menu.addEventListener('touchmove', (e) => e.stopPropagation(), { passive: true });

    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    document.body.classList.add(isMobile ? 'mobile' : 'desktop');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    scene.fog = new THREE.Fog(0xffffff, 25, 70);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const gridSize = 200;
    const divisions = 100;
    const grid = new THREE.GridHelper(gridSize, divisions, 0x888888, 0xaaaaaa);
    grid.material.fog = true;
    scene.add(grid);

    const planeGeo = new THREE.PlaneGeometry(gridSize, gridSize);
    const planeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -0.01;
    scene.add(plane);

    const keys = { w: false, a: false, s: false, d: false };
    let moveX = 0;
    let moveZ = 0;
    let yaw = 0;
    let pitch = -0.3;
    const speed = 8;
    const lookSensitivity = 0.002;

    let pointerLocked = false;
    document.addEventListener('click', () => {
      if (!isMobile && !pointerLocked) {
        renderer.domElement.requestPointerLock();
      }
    });
    document.addEventListener('pointerlockchange', () => {
      pointerLocked = document.pointerLockElement === renderer.domElement;
    });

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isMobile && pointerLocked) {
        yaw -= e.movementX * lookSensitivity;
        pitch -= e.movementY * lookSensitivity;
        pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
      }
    });
