<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Grid Floor Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #ffffff; font-family: system-ui, sans-serif; touch-action: none; }
    canvas { display: block; }
    #joystick {
      position: fixed;
      bottom: 110px;
      left: 40px;
      width: 130px;
      height: 130px;
      background: rgba(0,0,0,0.08);
      border: 2px solid rgba(0,0,0,0.18);
      border-radius: 50%;
      display: none;
      touch-action: none;
      z-index: 20;
    }
    #knob {
      position: absolute;
      width: 54px;
      height: 54px;
      background: rgba(0,0,0,0.35);
      border-radius: 50%;
      left: 38px;
      top: 38px;
      pointer-events: none;
    }
    .mobile #joystick { display: block; }

    #menu {
      position: fixed;
      bottom: 80px;
      left: 16px;
      right: 70px;
      max-width: 380px;
      background: rgba(240, 240, 240, 0.95);
      border-radius: 14px;
      padding: 6px;
      display: flex;
      gap: 4px;
      z-index: 15;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateY(140%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
    }
    #menu.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .menu-item {
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #555;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
      text-align: center;
    }
    .menu-item:hover,
    .menu-item.active {
      background: rgba(0,0,0,0.07);
      color: #222;
    }
    .menu-item.active {
      background: rgba(0,0,0,0.11);
    }

    #menu-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(245, 245, 245, 0.96);
      border: 2px solid rgba(0,0,0,0.1);
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      z-index: 30;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #444;
      transition: background 0.15s, transform 0.15s;
    }
    #menu-toggle:active {
      transform: scale(0.92);
      background: rgba(230, 230, 230, 0.98);
    }

    @media (max-width: 600px) {
      #menu {
        bottom: 78px;
        left: 12px;
        right: 68px;
        padding: 5px;
        gap: 3px;
      }
      .menu-item {
        padding: 10px 6px;
        font-size: 12px;
      }
      #joystick {
        bottom: 100px;
        left: 20px;
        width: 120px;
        height: 120px;
      }
      #knob {
        width: 50px;
        height: 50px;
        left: 35px;
        top: 35px;
      }
      #menu-toggle {
        bottom: 18px;
        right: 16px;
        width: 46px;
        height: 46px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="joystick">
    <div id="knob"></div>
  </div>
  <div id="menu">
    <button class="menu-item active" data-section="buildings">Buildings</button>
    <button class="menu-item" data-section="roads">Roads</button>
    <button class="menu-item" data-section="decoration">Decoration</button>
    <button class="menu-item" data-section="electronic">Electronic</button>
  </div>
  <button id="menu-toggle">☰</button>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    const menu = document.getElementById('menu');
    const menuToggle = document.getElementById('menu-toggle');
    const menuItems = document.querySelectorAll('.menu-item');

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('open');
    });
    menuToggle.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });

    menuItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        menuItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        if (window.innerWidth <= 600) menu.classList.remove('open');
      });
      item.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    });
    menu.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    menu.addEventListener('touchmove', (e) => e.stopPropagation(), { passive: true });

    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    document.body.classList.add(isMobile ? 'mobile' : 'desktop');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    scene.fog = new THREE.Fog(0xffffff, 25, 70);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const gridSize = 200;
    const divisions = 100;
    const grid = new THREE.GridHelper(gridSize, divisions, 0x888888, 0xaaaaaa);
    grid.material.fog = true;
    scene.add(grid);

    const planeGeo = new THREE.PlaneGeometry(gridSize, gridSize);
    const planeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -0.01;
    scene.add(plane);

    const keys = { w: false, a: false, s: false, d: false };
    let moveX = 0;
    let moveZ = 0;
    let yaw = 0;
    let pitch = -0.3;
    const speed = 8;
    const lookSensitivity = 0.002;

    let pointerLocked = false;
    document.addEventListener('click', () => {
      if (!isMobile && !pointerLocked) {
        renderer.domElement.requestPointerLock();
      }
    });
    document.addEventListener('pointerlockchange', () => {
      pointerLocked = document.pointerLockElement === renderer.domElement;
    });

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isMobile && pointerLocked) {
        yaw -= e.movementX * lookSensitivity;
        pitch -= e.movementY * lookSensitivity;
        pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
      }
    });

    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('knob');
    let joystickActive = false;
    let joystickId = null;
    const maxRadius = 46;
    const deadZone = 0.08;

    let targetMoveX = 0;
    let targetMoveZ = 0;
    const smoothFactor = 0.35;

    function updateJoystick(clientX, clientY) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }

      const knobSize = knob.offsetWidth;
      const baseLeft = (joystick.clientWidth - knobSize) / 2;
      const baseTop = (joystick.clientHeight - knobSize) / 2;
      knob.style.left = (baseLeft + dx) + 'px';
      knob.style.top = (baseTop + dy) + 'px';

      let nx = dx / maxRadius;
      let nz = -dy / maxRadius;
      const mag = Math.sqrt(nx * nx + nz * nz);
      if (mag < deadZone) {
        nx = 0;
        nz = 0;
      } else {
        const remapped = (mag - deadZone) / (1 - deadZone);
        nx = (nx / mag) * Math.min(remapped, 1);
        nz = (nz / mag) * Math.min(remapped, 1);
      }

      targetMoveX = nx;
      targetMoveZ = nz;
    }

    function resetJoystick() {
      targetMoveX = 0;
      targetMoveZ = 0;
      joystickActive = false;
      joystickId = null;
      const knobSize = knob.offsetWidth;
      const baseLeft = (joystick.clientWidth - knobSize) / 2;
      const baseTop = (joystick.clientHeight - knobSize) / 2;
      knob.style.left = baseLeft + 'px';
      knob.style.top = baseTop + 'px';
    }

    joystick.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joystickActive = true;
      joystickId = touch.identifier;
      updateJoystick(touch.clientX, touch.clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!joystickActive) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === joystickId) {
          e.preventDefault();
          updateJoystick(touch.clientX, touch.clientY);
          break;
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      for (let touch of e.changedTouches) {
        if (touch.identifier === joystickId) {
          resetJoystick();
          break;
        }
      }
    });

    let lookTouchId = null;
    let lastLookX = 0;
    let lastLookY = 0;

    window.addEventListener('touchstart', (e) => {
      if (joystickActive && e.target.closest('#joystick')) return;
      if (e.target.closest('#menu') || e.target.closest('#menu-toggle')) return;
      if (lookTouchId === null && e.changedTouches.length > 0) {
        const touch = e.changedTouches[0];
        const rect = joystick.getBoundingClientRect();
        if (touch.clientX < rect.left || touch.clientX > rect.right ||
            touch.clientY < rect.top || touch.clientY > rect.bottom) {
          lookTouchId = touch.identifier;
          lastLookX = touch.clientX;
          lastLookY = touch.clientY;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (lookTouchId === null) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === lookTouchId) {
          const dx = touch.clientX - lastLookX;
          const dy = touch.clientY - lastLookY;
          yaw -= dx * lookSensitivity * 1.5;
          pitch -= dy * lookSensitivity * 1.5;
          pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
          lastLookX = touch.clientX;
          lastLookY = touch.clientY;
          break;
        }
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      for (let touch of e.changedTouches) {
        if (touch.identifier === lookTouchId) {
          lookTouchId = null;
          break;
        }
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      moveX += (targetMoveX - moveX) * smoothFactor;
      moveZ += (targetMoveZ - moveZ) * smoothFactor;

      let inputX = moveX;
      let inputZ = moveZ;
      if (keys.w) inputZ += 1;
      if (keys.s) inputZ -= 1;
      if (keys.a) inputX -= 1;
      if (keys.d) inputX += 1;

      const len = Math.sqrt(inputX * inputX + inputZ * inputZ);
      if (len > 1) {
        inputX /= len;
        inputZ /= len;
      }

      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      camera.position.addScaledVector(forward, inputZ * speed * delta);
      camera.position.addScaledVector(right, inputX * speed * delta);
      camera.position.y = 5;

      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      const step = gridSize / divisions;
      grid.position.x = Math.round(camera.position.x / step) * step;
      grid.position.z = Math.round(camera.position.z / step) * step;
      plane.position.x = grid.position.x;
      plane.position.z = grid.position.z;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
